name: ci

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  industrial_ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env:
              ROS_DISTRO: humble
              ROS_REPO: main
          - env:
              ROS_DISTRO: jazzy
              ROS_REPO: main
          - env:
              ROS_DISTRO: kilted
              ROS_REPO: main
          - env:
              ROS_DISTRO: lyrical
              ROS_REPO: main
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Run industrial_ci
        uses: ros-industrial/industrial_ci@master
        env: ${{ matrix.env }}
